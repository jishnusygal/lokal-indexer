services:
  lokal-indexer:
    build: .
    ports:
      - "${LOKAL_PORT:-8000}:8000"
    env_file:
      - path: ${LOKAL_ENV_FILE:-./config/lokal-indexer/.env}
        required: false
    volumes:
      - ${LOKAL_DATA_DIR:-./config/lokal-indexer/data}:/app/data
      - ${LOKAL_TORRENT_DIR:-./torrents}:/app/torrents
    init: true
    restart: unless-stopped
    stop_grace_period: 16m
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      default:
        aliases:
          - indexer
