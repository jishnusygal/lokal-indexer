<style>
:root{
  --bg:#091113;--panel:#101b1f;--panel2:#142328;--ink:#f4faf8;--muted:#9fb1b7;
  --line:#263b42;--accent:#23c5a8;--accent2:#ffb84d;--danger:#ff6b6b;--ok:#4ade80;--input:#0b1518;
  --accent-ink:#04110f;
  --accent-soft:rgba(35,197,168,.14);--accent2-soft:rgba(255,184,77,.14);
  --danger-soft:rgba(255,107,107,.12);--ok-soft:rgba(74,222,128,.12);
  --line-soft:rgba(244,250,248,.07);
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);--shadow-md:0 10px 28px rgba(0,0,0,.22);
  --focus-ring:rgba(255,184,77,.55);
  font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 20% 0%,rgba(35,197,168,.12),transparent 30%),linear-gradient(180deg,#0c171a,#070d0f 420px);
  color:var(--ink)
}
*{box-sizing:border-box}
body{margin:0}
.shell{max-width:1280px;margin:0 auto;padding:28px}
.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:18px 0 26px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:48px;height:48px;display:grid;place-items:center;background:#0d201f;border:1px solid #2d5752;border-radius:var(--radius-sm);color:var(--accent);font-weight:900;box-shadow:0 0 0 3px var(--accent-soft)}
h1{margin:0 0 7px;font-size:2rem;line-height:1}
h2{margin:0 0 5px;font-size:1.12rem}
h3{margin:0 0 14px;color:var(--accent2);font-size:.82rem;text-transform:uppercase;letter-spacing:.12em}
p{margin:0;color:var(--muted);line-height:1.5}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:8px;background:#0d181b;border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:#dce9e7;font-weight:800;font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.running{background:var(--accent2)}
button{border:0;font:inherit}
a.button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.button{min-height:42px;padding:10px 16px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-ink);font-weight:900;cursor:pointer}
.button.secondary{background:#24343a;color:var(--ink);border:1px solid #385158}
.button.compact{min-height:32px;padding:6px 12px;font-size:.82rem}
.button:hover,.button.secondary:hover{filter:brightness(1.08)}
.button:active{transform:scale(.98)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.notice{margin:18px 0 0;padding:14px 16px;border-radius:var(--radius-md);background:var(--ok-soft);border:1px solid rgba(74,222,128,.35);color:#d6ffe7;font-weight:800}
.notice.error{background:var(--danger-soft);border-color:rgba(255,107,107,.4);color:#ffe1e1}
.grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:20px;margin-top:22px}
.panel{background:linear-gradient(180deg,var(--panel),#0d171a);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);overflow:hidden}
.section{padding:24px}
.section+.section{border-top:1px solid var(--line)}
.section-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-variant-numeric:tabular-nums;font-size:2.1rem;font-weight:550;line-height:1;color:#fff}
.stat .stat-label{display:block;margin-top:6px;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;border:1px solid currentColor;background:transparent;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.badge-ok{color:var(--ok)}
.badge-muted{color:var(--muted)}
.badge-danger{color:var(--danger)}
.badge.status-success{color:var(--ok)}
.badge.status-failure{color:var(--danger)}
.note{margin-top:13px;padding:12px 13px;background:#171a13;border-left:4px solid var(--accent2);border-radius:0 var(--radius-sm) var(--radius-sm) 0;color:#e9ddc7}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.appbox{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px}
.appbox h3{color:var(--ink);letter-spacing:0;text-transform:none;font-size:1rem;margin-bottom:10px}
.endpoint{display:grid;gap:8px;margin-top:10px}
.endpoint span,.endpoint label{display:block;margin:0;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.test-link{display:inline-block;margin-top:10px;color:var(--accent);font-size:.82rem;font-weight:800;text-decoration:none}
.test-link:hover{text-decoration:underline}
input:not([type=checkbox]){width:100%;min-height:42px;padding:10px 11px;border-radius:var(--radius-sm);background:var(--input);border:1px solid #35515a;color:var(--ink);font:inherit}
input[readonly]{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d8fff7;overflow-x:auto;white-space:nowrap}
.mask{letter-spacing:.12em}
small{display:block;margin-top:6px;color:var(--muted);font-size:.84rem;line-height:1.4}
form{margin:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
label{display:block;margin-bottom:7px;font-weight:850;color:#edf7f5}
.checkline{display:flex;gap:9px;align-items:flex-start;color:#d7e4e1;font-weight:750}
.checkline input{margin-top:4px}
.form-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;background:#0b1417;border-top:1px solid var(--line)}
.logs-wrap{border:1px solid var(--line);border-radius:var(--radius-md);overflow:auto}
.logs{width:100%;border-collapse:collapse;font-size:.91rem}
.logs th,.logs td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.logs th{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--panel2)}
.logs tbody tr:hover{background:var(--line-soft)}
.logs tbody tr:last-child td{border-bottom:0}
.empty{padding:20px;color:var(--muted)}
.help{background:#0d181b;border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;margin-top:12px}
.help b{color:var(--ink)}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-wrap{max-width:400px;width:100%}
.auth-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px}
.auth-brand .mark{width:40px;height:40px}
.auth-brand span{font-weight:900;font-size:1.2rem}
.auth-card{padding:28px}
.auth-card h1{font-size:1.4rem;text-align:center;margin:0 0 6px}
.auth-card>p{text-align:center;margin:0 0 22px}
.auth-field{margin:0 0 16px}
.auth-field label{display:block;margin-bottom:7px}
.auth-submit{width:100%;margin-top:6px}
.auth-footnote{text-align:center;font-size:.82rem;color:var(--muted);margin-top:20px;line-height:1.6}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(4,8,9,.72);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal-overlay:target{display:flex}
.modal-backdrop{position:absolute;inset:0;z-index:0}
.modal{position:relative;z-index:1;background:linear-gradient(180deg,var(--panel),#0d171a);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);max-width:420px;width:100%;padding:24px;max-height:calc(100vh - 40px);overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-close{color:var(--muted);font-size:1.3rem;line-height:1;text-decoration:none;padding:4px 10px;border-radius:var(--radius-sm)}
.modal-close:hover{background:var(--line-soft);color:var(--ink)}
.modal form{margin-top:18px}
.modal .auth-field:last-of-type{margin-bottom:0}
.modal-logout{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
@media (max-width:940px){.shell{padding:18px}.topbar,.section-head,.form-footer{display:block}.actions{justify-content:flex-start;margin-top:15px}.grid,.apps,.fields{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:1.6rem}}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}.stat:nth-child(odd){border-right:1px solid var(--line)}.stat:nth-child(even){border-right:0}.stat:nth-last-child(-n+2){border-bottom:0}}
@media (max-width:520px){.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}}
</style>
