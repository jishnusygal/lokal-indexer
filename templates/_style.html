<style>
:root{
  color-scheme:dark;
  --bg:#101318;--surface:#181d25;--raised:#202732;--text:#edf1f7;--muted:#a6b0c0;--border:#303947;
  --primary:#2563eb;--success:#86efac;--danger:#fca5a5;--warn:#fde68a;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text)
}
*{box-sizing:border-box}
body{margin:0}
a{color:inherit;text-decoration:none}
h1,h2,p{margin:0}
p{color:var(--muted);line-height:1.5}
.muted{color:var(--muted)}
button,.button,input:not([type=checkbox]),select{font:inherit;border:1px solid var(--border);border-radius:7px;padding:10px 14px;background:var(--raised);color:var(--text)}
input[type=checkbox]{width:auto;accent-color:var(--primary)}
button,.button{cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;min-height:42px;transition:filter 120ms cubic-bezier(0,0,.2,1),transform 90ms cubic-bezier(0,0,.2,1)}
button:hover,.button:hover{filter:brightness(1.15)}
button:active,.button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #93c5fd;outline-offset:3px}
.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.compact{padding:6px 12px;min-height:32px;font-size:.82rem}

.topbar{height:80px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 5vw}
.brand{display:flex;align-items:center;gap:10px;font-size:20px}
.brand-icon{background:var(--primary);border-radius:7px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-end{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--muted)}

.shell{max-width:1400px;margin:0 auto;padding:44px 5vw 20px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.eyebrow{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--muted);margin:0 0 10px;text-transform:uppercase}
h1{font-size:34px;letter-spacing:-1px;font-weight:650}
h2{font-size:18px;font-weight:650;margin-bottom:4px}
h3{font-size:14px;font-weight:650;margin:0 0 14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--success)}
.dot.running{background:var(--warn)}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--border);border-radius:10px}
.metrics>div{padding:24px 28px;border-right:1px solid var(--border)}
.metrics>div:last-child{border-right:0}
.metrics>div>span:first-child{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.metrics strong{display:block;font-size:34px;font-weight:550;font-variant-numeric:tabular-nums}
.metrics .badge{margin-top:2px}

.sync-state{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:17px 2px 26px;font-size:12px;flex-wrap:wrap}

.badge{display:inline-block;border:1px solid var(--border);border-radius:5px;padding:3px 7px;font-size:10px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.badge.ok{color:var(--success)}
.badge.muted{color:var(--muted)}
.badge.danger{color:var(--danger)}
.badge.status-success{color:var(--success)}
.badge.status-failure{color:var(--danger)}

.notice,.error{padding:12px 14px;border:1px solid var(--border);border-radius:7px;margin:0 0 20px;font-weight:500}
.notice.success{color:var(--success)}
.error{color:var(--danger)}

.grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.section{padding:24px}
.section+.section{border-top:1px solid var(--border)}
.section-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
form{margin:0}
form+form{border-top:1px solid var(--border)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
label{display:block;margin-bottom:7px;font-weight:600;font-size:13px}
small{display:block;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.4}
.checkline{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:500}
.checkline input{margin-top:4px}
input[readonly]{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
.mask{letter-spacing:.12em}

.endpoint{display:grid;gap:8px;margin-top:10px}
.endpoint>div{display:flex;gap:8px;align-items:center}
.endpoint input{width:100%;min-width:0}
.endpoint span,.endpoint label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin:0}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.appbox{background:var(--raised);border:1px solid var(--border);border-radius:10px;padding:20px}
.appbox h3{margin-bottom:14px}
.test-link{display:inline-block;margin-top:12px;color:var(--primary);font-size:12px;font-weight:600}
.test-link:hover{text-decoration:underline}

.help{background:var(--raised);border:1px solid var(--border);border-radius:7px;padding:13px;margin-top:12px;font-size:12px;color:var(--muted)}
.help b{color:var(--text)}

details.section{padding:0}
details.section>summary{padding:24px;margin:0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650}
details.section>summary::-webkit-details-marker{display:none}
details.section>summary::after{content:'\25be';color:var(--muted);font-size:11px}
details.section[open]>summary::after{content:'\25b4'}
details.section>.fields{padding:0 24px 24px}

.form-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;background:var(--bg);border-top:1px solid var(--border)}

.logs-wrap{overflow-x:auto}
.logs{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
.logs th{padding:12px 20px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;border-block:1px solid var(--border);background:var(--bg)}
.logs td{padding:14px 20px;border-bottom:1px solid var(--border);vertical-align:top}
.logs tbody tr:hover{background:var(--raised)}
.logs tbody tr:last-child td{border-bottom:0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--border);padding:22px 0 0;margin:20px 0 40px;color:var(--muted);font-size:11px}

@media (max-width:940px){
  .topbar{padding:0 24px}
  .shell{padding:32px 24px 24px}
  .heading,.section-head,.form-footer{flex-direction:column;align-items:flex-start}
  .actions{width:100%}
  .grid,.apps,.fields{grid-template-columns:1fr}
  .full{grid-column:auto}
  h1{font-size:26px}
}
@media (max-width:900px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .metrics>div{border-bottom:1px solid var(--border)}
  .metrics>div:nth-child(odd){border-right:1px solid var(--border)}
  .metrics>div:nth-child(even){border-right:0}
  .metrics>div:nth-last-child(-n+2){border-bottom:0}
}
@media (max-width:520px){
  .metrics{grid-template-columns:1fr}
  .metrics>div{border-right:0;border-bottom:1px solid var(--border)}
  .metrics>div:last-child{border-bottom:0}
  h1{font-size:22px}
  .topbar-end{display:none}
  footer{flex-direction:column}
}
</style>
